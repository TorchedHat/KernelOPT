[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelopt"
version = "0.1.0"
description = "Multi-agent GPU kernel optimizer powered by LangGraph and NCU"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["gpu", "kernel", "optimization", "triton", "cuda", "profiling", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
    "typer[all]>=0.12",
    "langgraph>=0.2",
    "langchain-anthropic>=1.0",
    "anthropic[vertex]>=0.80",
    "pydantic>=2.0",
    "rich>=13.0",
    "torch>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
triton = ["triton>=3.0"]
semantic = ["sentence-transformers>=3.0"]
local = ["langchain-openai>=0.2"]
all-providers = [
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-huggingface>=0.1",
]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
kernelopt = "kernelopt.cli:app"

[project.urls]
Repository = "https://github.com/TorchedHat/KernelOPT"
"Bug Tracker" = "https://github.com/TorchedHat/KernelOPT/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["improvements*", "pipeline_output*", "test*"]

[tool.setuptools.package-data]
kernelopt = ["data/*.json"]
