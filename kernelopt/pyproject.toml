[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelopt"
version = "0.1.0"
description = "Multi-agent GPU kernel optimizer powered by LangGraph and NCU"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    "typer[all]>=0.12",
    "langgraph>=0.2",
    "langchain-anthropic>=1.0",
    "anthropic>=0.80",
    "pydantic>=2.0",
    "rich>=13.0",
    "torch>=2.0",
]

[project.optional-dependencies]
triton = ["triton>=3.0"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
kernelopt = "kernelopt.cli:app"

[project.urls]
Repository = "https://github.com/yourorg/kernelopt"
