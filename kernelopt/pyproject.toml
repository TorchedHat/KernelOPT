[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelopt"
version = "0.1.0"
description = "Multi-agent GPU kernel optimizer powered by LangGraph and NCU"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    "typer[all]>=0.12",
    "langgraph>=0.2",
    "langchain-openai>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "torch>=2.0",
]

[project.optional-dependencies]
triton = ["triton>=3.0"]
local = ["openai>=1.0"]
torchserve = [
    "torchserve>=0.12",
    "torch-model-archiver>=0.12",
    "transformers>=4.40",
    "accelerate>=0.30",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
kernelopt = "kernelopt.cli:app"

[project.urls]
Repository = "https://github.com/yourorg/kernelopt"
