[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelopt"
version = "0.1.0"
description = "Multi-agent GPU kernel optimizer powered by LangGraph and NCU"
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "typer[all]>=0.12",
    "langgraph>=0.2",
    "langchain-anthropic>=1.0",
    "anthropic[vertex]>=0.80",
    "pydantic>=2.0",
    "rich>=13.0",
    "torch>=2.0",
    "google-auth-oauthlib>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
triton = ["triton>=3.0"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
kernelopt = "kernelopt.cli:app"

[project.urls]
Repository = "https://github.com/yourorg/kernelopt"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["improvements*", "pipeline_output*", "test*"]
