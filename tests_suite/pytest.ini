[pytest]
# Pytest configuration for kernel optimization tool tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    optimization: marks tests for full optimization pipeline (deselect with '-m "not optimization"')
    gpu: marks tests that require CUDA GPU (deselect with '-m "not gpu"')
    agent: marks tests for individual agents (requires LLM)
    profiling: marks tests that use NCU profiling (requires ≥40% free GPU memory)
    h200: marks tests optimized for H200 GPUs

# Output options
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Test paths
testpaths = .

# Ignore patterns
norecursedirs = .git __pycache__ *.egg-info

# Coverage options (when --cov is used)
[coverage:run]
source = kernelopt
omit =
    */test/*
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
